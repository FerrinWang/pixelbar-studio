name: Validate
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run build:engine
